# Static analysis on every push: tools that read the code without running it, looking for likely mistakes and for the
# ways a program comes to be unsafe.
#   - Ruff reads the Python (pyflakes, bugbear and bandit's security rules; ruff.toml says which, and why not the rest).
#   - ESLint reads the pages' JavaScript (its recommended rules, and Mozilla's rules against setting markup from text;
#     eslint.config.mjs).
#   - CodeQL, GitHub's own analysis, follows data through the Python and the JavaScript and reports what it finds as
#     code scanning alerts ("Security and quality" tab). GitHub offers it free to public repositories only, so it is
#     skipped while this one is private.
# ReviewDesk itself needs none of these installed. The versions are fixed here so that a new release of a tool cannot
# turn a push red by itself; raise them deliberately.
name: static analysis

on:
  push:
    branches: ["**"]              # (not for a tag: a release's tag is a commit that has been analysed already)
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"          # every Monday, so that new CodeQL queries are run against code that has not changed

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (Python) and ESLint (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.4
          ruff check --output-format=github

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: ESLint
        run: |
          npm install --no-save --no-audit --no-fund eslint@10.14.0 @eslint/js@10.0.1 eslint-plugin-no-unsanitized@4.1.5 globals@17.14.0
          npx eslint app/reviewdesk/static

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Only once the repository is public (see the note at the top): when the event says, in so many words, that the
    # repository is not private. An event that does not say (toJSON gives 'null') skips CodeQL rather than failing it.
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write        # to report what it finds as code scanning alerts
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # The program and the tools that build a release are analysed. The tests are left out: they start stand-in
          # services, use invented keys and write to temporary folders on purpose, and none of them is in a download.
          config: |
            paths-ignore:
              - tests

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
